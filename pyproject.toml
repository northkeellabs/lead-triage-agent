[project]
name = "lead-triage-agent"
version = "0.1.0"
description = "Inbound B2B lead triage agent: research, ICP scoring, draft reply, human approval, then CRM writes via MCP. Runs free on local Ollama."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12,<3.13"
authors = [{ name = "Northkeel Labs" }]
dependencies = [
    "langgraph==1.2.20",
    "langgraph-checkpoint-sqlite==3.1.3",
    "langchain-core==1.7.7",
    "langchain-ollama==1.1.0",
    "langchain-mcp-adapters==0.3.2",
    "mcp==1.30.0",
    "fastapi==0.162.2",
    "uvicorn==0.54.0",
    "httpx==0.28.1",
    "pydantic==2.14.3",
    "pyyaml==6.0.3",
    "beautifulsoup4==4.15.0",
]

[project.optional-dependencies]
anthropic = ["langchain-anthropic==1.7.10"]
openai = ["langchain-openai==1.7.4"]
gemini = ["langchain-google-genai==4.4.3"]

[dependency-groups]
dev = ["pytest==9.2.0", "pytest-asyncio==1.4.1.post1"]

[project.scripts]
triage = "lead_triage.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lead_triage"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
